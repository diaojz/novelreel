[project]
name = "novelreel"
version = "0.1.0"
description = "小说 → 推文短视频（教学版）：用明文 Python 复刻 ArcReel 的三层 Agent 编排范式"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "openai>=1.55",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build.targets.wheel]
packages = ["src/novelreel"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
